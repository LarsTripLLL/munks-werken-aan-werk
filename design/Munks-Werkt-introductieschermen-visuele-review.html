 return '<svg class="landscape" viewBox="0 0 400 340" role="img" aria-label="Stap '+step+' van 7 op de route"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7c9ca"/><stop offset="1" stop-color="#eff0f0"/></linearGradient></defs><path d="M0 270 C60 260 80 210 140 215 C190 218 220 174 251 128 C282 82 310 48 330 56 C354 66 372 113 400 130 L400 340 L0 340Z" fill="url(#'+id+')"/><path d="'+full+'" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/><path d="'+paths[step-1]+'" fill="none" stroke="#ff5a00" stroke-width="14" stroke-linecap="round"/><g font-family="Inter,Arial,sans-serif" font-weight="700" text-anchor="middle">'+nodes+'</g><path d="M328 56V25" stroke="#5f6669" stroke-width="3"/><path d="M329 25l21 6-21 10z" fill="#ff5a00"/><g fill="#aeb2b4" opacity=".8"><path d="M55 302q9-19 18 0q8-17 16 0z"/><path d="M260 284q9-18 17 0q7-15 15 0z"/><path d="M345 265q10-20 20 0q8-16 17 0z"/></g></svg>'
}

const root=document.getElementById('screens');
steps.forEach((s,i)=>{const n=i+1;root.insertAdjacentHTML('beforeend','<article class="review"><h2>Stap '+n+' - '+s.title+'</h2><div class="phone">'+status()+'<header class="brand"><span></span><img class="logo" src="'+logo+'" alt="Munks Werkt">'+bell()+'</header><div class="intro"><h3>'+s.title+'</h3><p>'+s.intro+'</p></div><div class="meta"><span>Stap '+n+' van 7</span><span>'+s.time+'</span></div><section class="card"><h4>'+s.card+'</h4><p>'+s.body+'</p>'+mountain(n)+'<button class="action">'+s.button+' &rarr;</button></section><nav class="nav"><span>Home</span><strong>Traject</strong><span>Berichten</span><span>Mijn omgeving</span></nav></div></article>')});
