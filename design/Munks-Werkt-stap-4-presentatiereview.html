<!doctype html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Munks Werkt – presentatiereview stap 4</title>
  <style>
    :root{color-scheme:light;--warm:#fff3d8;--warm-2:#fff9eb;--ink:#14242b;--muted:#58666c;--orange:#ff5a00;--orange-soft:#fff0e6;--line:#eadfc9;--white:#fff;--shadow:0 12px 34px rgba(74,53,20,.12);font-family:Inter,Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:#f1ede5;color:var(--ink)}button,input,textarea,select{font:inherit}
    .review{display:grid;grid-template-columns:285px 1fr;min-height:100vh}.side{padding:28px 22px;background:#1e2b31;color:#fff}.side h1{margin:0 0 7px;font-size:24px}.side p{margin:0 0 24px;color:#c9d0d3;line-height:1.45}.menu{display:grid;gap:7px}.menu button{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:center;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:#dce1e3;text-align:left;cursor:pointer}.menu button:hover,.menu button.active{background:#fff;color:#1e2b31}.menu b{display:grid;width:26px;height:26px;place-items:center;border-radius:50%;background:#435159;color:#fff;font-size:12px}.menu button.active b{background:var(--orange)}
    .stage{display:grid;place-items:start center;padding:30px 24px 48px}.stage-head{width:min(100%,920px);margin-bottom:18px}.stage-head h2{margin:0 0 5px;font-size:26px}.stage-head p{margin:0;color:#617077}.pager{display:flex;gap:9px;margin-top:14px}.pager button{padding:8px 13px;border:1px solid #d1cbc0;border-radius:9px;background:#fff;color:#27373e;cursor:pointer}.pager button:disabled{opacity:.4}
    .phone{width:390px;max-width:100%;overflow:hidden;border:1px solid #e6d7b9;border-radius:34px;background:var(--warm);box-shadow:0 22px 60px rgba(48,38,22,.2)}.screen{padding:17px 17px 0}.status{display:flex;justify-content:space-between;align-items:center;margin:0 3px 17px;font-size:13px;font-weight:700}.island{width:92px;height:25px;border-radius:99px;background:#111}.signals{letter-spacing:2px}
    .brand{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:20px}.brand img{grid-column:2;display:block;width:242px;max-width:100%;height:auto;mix-blend-mode:multiply}.bell{position:relative;justify-self:end;width:25px;height:25px;border:2px solid #56636a;border-radius:13px 13px 9px 9px}.bell:after{content:"";position:absolute;right:-2px;top:-3px;width:8px;height:8px;border:2px solid var(--warm);border-radius:50%;background:var(--orange)}
    .intro{margin:0 2px 14px}.intro h3{margin:0 0 4px;font-size:26px;line-height:1.1}.intro p{margin:0;color:#46575f;line-height:1.45}.route{display:flex;align-items:center;gap:9px;margin-bottom:13px;padding:10px 12px;border-radius:15px;background:rgba(255,255,255,.62)}.route-copy{min-width:87px}.route-copy strong{display:block;color:var(--orange);font-size:12px;text-transform:uppercase}.route-copy span{font-size:12px;color:#5c6a70}.route-line{display:flex;flex:1;align-items:center}.route-line i{position:relative;display:grid;width:20px;height:20px;place-items:center;border:2px solid #c9cdce;border-radius:50%;background:#fff;color:#5c666b;font-size:10px;font-style:normal;font-weight:700}.route-line i:not(:last-child):after{content:"";position:absolute;left:18px;top:7px;width:17px;height:3px;background:#d5d8d8}.route-line i.done,.route-line i.current{border-color:var(--orange);background:var(--orange);color:#fff}.route-line i.done:not(:last-child):after{background:var(--orange)}.route-line i.current{box-shadow:0 0 0 3px #fff}
    .panel{padding:20px 18px 18px;border-radius:23px;background:var(--white);box-shadow:var(--shadow)}.panel h4{margin:0 0 7px;font-size:21px}.panel>.lead{margin:0 0 16px;color:#46575f;line-height:1.45}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}.fact{padding:11px;border-radius:13px;background:var(--orange-soft)}.fact strong{display:block;color:var(--orange);font-size:13px}.fact span{font-size:12px;color:#4e5d63}.fields{display:grid;gap:11px}.field label{display:block;margin-bottom:5px;font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #d9dcdb;border-radius:12px;background:#fff;color:var(--ink)}.field textarea{min-height:72px;resize:none}.checks{display:grid;gap:8px}.check{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e0e2e1;border-radius:12px}.check i{display:grid;width:22px;height:22px;place-items:center;border:2px solid #c8cdcf;border-radius:50%;font-style:normal}.check.selected{border-color:#ffb487;background:#fff7f1}.check.selected i{border-color:var(--orange);background:var(--orange);color:#fff}.note{display:flex;gap:9px;margin-top:13px;padding:11px;border-radius:12px;background:#f1f2f1;color:#44545a;font-size:12px;line-height:1.4}.note b{color:var(--orange)}
    .actions{display:grid;gap:8px;margin-top:15px}.primary,.secondary{width:100%;padding:13px;border-radius:13px;font-weight:700;cursor:pointer}.primary{border:0;background:var(--orange);color:#fff}.secondary{border:0;background:transparent;color:#26363d}.cv{display:grid;gap:10px}.cv-head{padding-bottom:11px;border-bottom:2px solid #f0e5d0}.cv-head h4{font-size:23px}.cv-head p{margin:3px 0 0;color:#5d6a70}.cv-section{padding:10px 0;border-bottom:1px solid #eceeed}.cv-section:last-child{border:0}.cv-section strong{display:block;margin-bottom:4px;color:var(--orange);font-size:12px;text-transform:uppercase}.cv-section p{margin:0;font-size:13px;line-height:1.4}.meeting{display:grid;gap:10px}.meeting-row{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:14px;background:#fff7f1}.meeting-icon{display:grid;flex:0 0 38px;height:38px;place-items:center;border-radius:50%;background:#fff0e6;color:var(--orange);font-size:20px}.meeting-row strong{display:block;margin-bottom:2px}.meeting-row span{color:#59686e;font-size:13px;line-height:1.35}
    nav{display:grid;grid-template-columns:repeat(4,1fr);margin:17px -17px 0;padding:10px 5px 13px;border-top:1px solid var(--line);background:var(--warm-2)}.nav{display:grid;place-items:center;gap:3px;color:#59676d;font-size:11px}.nav .ico{font-size:20px;line-height:1}.nav.active{color:var(--orange);font-weight:700}
    @media(max-width:760px){.review{display:block}.side{padding:18px}.side p{margin-bottom:12px}.menu{display:flex;overflow:auto}.menu button{min-width:155px}.stage{padding:20px 10px 35px}.stage-head{width:390px;max-width:100%}}
  </style>
</head>
<body>
<main class="review">
  <aside class="side">
    <h1>Stap 4 · Maak je cv</h1>
    <p>Losse presentatiereview in de visuele stijl van Home.</p>
    <div class="menu" id="menu"></div>
  </aside>
  <section class="stage">
    <header class="stage-head"><h2 id="reviewTitle"></h2><p id="reviewSubtitle"></p><div class="pager"><button id="previous">← Vorige</button><button id="next">Volgende →</button></div></header>
    <article class="phone" aria-label="Mobiel voorbeeldscherm">
      <div class="screen">
        <div class="status"><span>9:41</span><span class="island"></span><span class="signals">● ◒ ▰</span></div>
        <header class="brand"><img src="Munks-Werkt-logo.png" alt="Munks Werkt" style="display:block;width:245px;max-width:100%;height:auto;filter:brightness(.82) saturate(1.04)"><span class="bell" aria-label="Meldingen"></span></header>
        <div class="intro"><h3 id="screenTitle"></h3><p id="screenSubtitle"></p></div>
        <div class="route"><div class="route-copy"><strong>Stap 4</strong><span id="partLabel"></span></div><div class="route-line" aria-label="Stap 4 van 7"><i class="done">1</i><i class="done">2</i><i class="done">3</i><i class="current">4</i><i>5</i><i>6</i><i>7</i></div></div>
        <section class="panel" id="content"></section>
        <nav><div class="nav"><span class="ico">⌂</span><span>Home</span></div><div class="nav active"><span class="ico">⌁</span><span>Traject</span></div><div class="nav"><span class="ico">▣</span><span>Berichten</span></div><div class="nav"><span class="ico">○</span><span>Mijn omgeving</span></div></nav>
      </div>
    </article>
  </section>
</main>
<script>
const screens=[
 {menu:'Introductie',title:'Maak je cv',subtitle:'Bouw stap voor stap een cv dat bij jou past.',part:'Introductie',body:`<h4>Jouw cv</h4><p class="lead">Je hoeft niet alles in één keer in te vullen. We bouwen je cv op in kleine, overzichtelijke onderdelen.</p><div class="facts"><div class="fact"><strong>5 onderdelen</strong><span>Rustig stap voor stap</span></div><div class="fact"><strong>Automatisch opgeslagen</strong><span>Je kunt later verder</span></div></div><div class="note"><b>✓</b><span>Je interesses, opleiding en ervaring kunnen allemaal op je cv. De AI-assistent kan je helpen om teksten duidelijk op te schrijven.</span></div><div class="actions"><button class="primary">Start mijn cv</button></div>`},
 {menu:'Jouw gegevens',title:'Over mij',subtitle:'De basis van je cv.',part:'Onderdeel 1 van 5',body:`<h4>Jouw gegevens</h4><p class="lead">Een aantal velden zijn al ingevuld. Wil je kijken of deze kloppen en waar nodig de gegevens aanpassen of aanvullen?</p><div class="fields"><div class="field"><label>Voor- en achternaam</label><input value="Sam de Vries"></div><div class="field"><label>Woonplaats en leeftijd</label><input value="Zeist · 20 jaar"></div><div class="field"><label>Telefoonnummer</label><input value="06 12 34 56 78"></div><div class="field"><label>E-mailadres</label><input value="sam@email.nl"></div></div><div class="note"><b>✓</b><span>Wordt automatisch opgeslagen. Je volledige adres en geboortedatum zijn niet nodig.</span></div><div class="actions"><button class="primary">Opslaan en verder</button></div>`},
 {menu:'Dit ben ik',title:'Dit ben ik',subtitle:'Laat zien wie jij bent en wat bij jou past.',part:'Onderdeel 2 van 5',body:`<h4>Vertel iets over jezelf</h4><p class="lead">Met een paar korte antwoorden maken we straks een persoonlijke tekst voor je cv.</p><div class="fields"><div class="field"><label>Hoe zou je jezelf omschrijven?</label><textarea>Ik ben rustig, behulpzaam en werk graag met anderen.</textarea></div><div class="field"><label>Waar ben je goed in?</label><input value="Luisteren en praktisch bezig zijn"></div><div class="field"><label>Wat vind je leuk en waar krijg je energie van?</label><input value="Mensen helpen"></div></div><div class="note"><b>AI</b><span>We maken hiervan een korte introductie. Jij bekijkt en controleert de tekst voordat deze op je cv komt.</span></div><div class="actions"><button class="primary">Maak mijn introductie</button></div>`},
 {menu:'Ervaring',title:'Mijn ervaring',subtitle:'Laat zien wat je al hebt gedaan.',part:'Onderdeel 3 van 5',body:`<h4>Voeg je ervaring toe</h4><p class="lead">Werk, een bijbaan, stage en vrijwilligerswerk kunnen allemaal op je cv.</p><div class="checks"><div class="check selected"><i>✓</i><span>Werk of bijbaan</span></div><div class="check"><i></i><span>Stage</span></div><div class="check"><i></i><span>Vrijwilligerswerk</span></div><div class="check"><i></i><span>Anders</span></div></div><div class="fields" style="margin-top:11px"><div class="field"><label>Bedrijf of organisatie</label><input value="Bakkerij De Hoek"></div><div class="field"><label>Wat deed je daar?</label><input value="Klanten helpen en bestellingen klaarmaken"></div><div class="field"><label>Wanneer was dit?</label><input value="2023 – 2024"></div></div><div class="actions"><button class="primary">Ervaring opslaan</button><button class="secondary">Ik heb nog geen ervaring</button></div>`},
 {menu:'Opleiding',title:'Opleiding en leren',subtitle:'Laat zien wat je hebt geleerd.',part:'Onderdeel 4 van 5',body:`<h4>Voeg je opleiding toe</h4><p class="lead">Ook een opleiding die je niet hebt afgerond kan op je cv.</p><div class="fields"><div class="field"><label>Opleiding of richting</label><input value="Helpende Zorg en Welzijn"></div><div class="field"><label>School of opleider</label><input value="MBO Utrecht"></div><div class="field"><label>Wanneer volgde je deze opleiding?</label><input value="2021 – 2023"></div><div class="field"><label>Wat is de status?</label><select><option>Niet afgerond</option><option>Diploma behaald</option><option>Nog mee bezig</option></select></div></div><div class="note"><b>+</b><span>Hierna kun je ook een cursus, training of certificaat toevoegen.</span></div><div class="actions"><button class="primary">Opleiding opslaan</button><button class="secondary">Ik heb geen opleiding</button></div>`},
 {menu:'Extra informatie',title:'Extra informatie',subtitle:'Voeg toe wat nog belangrijk is voor jouw cv.',part:'Onderdeel 5 van 5',body:`<h4>Wil je nog iets toevoegen?</h4><p class="lead">Dit onderdeel is niet verplicht. Vul alleen in wat voor jou van toepassing is.</p><div class="fields"><div class="field"><label>Rijbewijs</label><select><option>Rijbewijs B</option><option>Geen rijbewijs</option><option>Rijbewijs AM</option></select></div><div class="field"><label>Talen</label><input value="Nederlands en Engels"></div><div class="field"><label>Certificaten</label><input placeholder="Bijvoorbeeld VCA of BHV"></div><div class="field"><label>Iets anders dat je wilt noemen</label><textarea placeholder="Schrijf hier wat jij belangrijk vindt"></textarea></div></div><div class="note"><b>✓</b><span>Jij bepaalt welke informatie uiteindelijk op je cv komt.</span></div><div class="actions"><button class="primary">Opslaan en bekijk mijn cv</button><button class="secondary">Dit onderdeel overslaan</button></div>`},
 {menu:'Bekijk je cv',title:'Bekijk jouw cv',subtitle:'Controleer rustig of alles klopt.',part:'Alle 5 onderdelen ingevuld',body:`<div class="cv"><div class="cv-head"><h4>Sam de Vries</h4><p>20 jaar · Zeist · 06 12 34 56 78</p></div><div class="cv-section"><strong>Dit ben ik</strong><p>Ik ben rustig, behulpzaam en werk graag met anderen. Ik krijg energie van mensen helpen en praktisch bezig zijn.</p></div><div class="cv-section"><strong>Mijn ervaring</strong><p>Bakkerij De Hoek · 2023 – 2024</p></div><div class="cv-section"><strong>Opleiding en leren</strong><p>Helpende Zorg en Welzijn · MBO Utrecht</p></div><div class="cv-section"><strong>Extra informatie</strong><p>Rijbewijs B · Nederlands en Engels</p></div></div><div class="note"><b>AI</b><span>Wil je hulp met de tekst? Laat de AI-assistent meekijken voordat je jouw cv opslaat.</span></div><div class="actions"><button class="primary">Download mijn cv</button><button class="secondary">Laat de AI-assistent meekijken</button></div>`},
 {menu:'Groepsbespreking',title:'Bespreek je cv',subtitle:'Je cv is klaar voor de groepsbijeenkomst.',part:'Afronding stap 4',body:`<h4>Samen naar je cv kijken</h4><p class="lead">Tijdens de groepsbijeenkomst bekijken jullie de cv’s en krijg je tips waarmee je jouw cv sterker kunt maken.</p><div class="meeting"><div class="meeting-row"><span class="meeting-icon">☑</span><div><strong>Bekijk je cv vooraf</strong><span>Controleer nog één keer of alles klopt.</span></div></div><div class="meeting-row"><span class="meeting-icon">◉</span><div><strong>Jij kiest wat je bespreekt</strong><span>Je bepaalt zelf wat je tijdens de bijeenkomst wilt laten zien.</span></div></div><div class="meeting-row"><span class="meeting-icon">↻</span><div><strong>Verwerk de tips</strong><span>Na de bijeenkomst kun je jouw cv nog aanpassen.</span></div></div></div><div class="actions"><button class="primary">Bekijk mijn cv</button></div>`}
];
let current=0;const menu=document.getElementById('menu'),content=document.getElementById('content');
function draw(){const s=screens[current];document.getElementById('reviewTitle').textContent=`${current+1}. ${s.menu}`;document.getElementById('reviewSubtitle').textContent=`Scherm ${current+1} van ${screens.length} · Stap 4 – Maak je cv`;document.getElementById('screenTitle').textContent=s.title;document.getElementById('screenSubtitle').textContent=s.subtitle;document.getElementById('partLabel').textContent=s.part;content.innerHTML=s.body;[...menu.children].forEach((b,i)=>b.classList.toggle('active',i===current));document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===screens.length-1;}
screens.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${i+1}</b><span>${s.menu}</span>`;b.onclick=()=>{current=i;draw()};menu.appendChild(b)});document.getElementById('previous').onclick=()=>{if(current>0){current--;draw()}};document.getElementById('next').onclick=()=>{if(current<screens.length-1){current++;draw()}};draw();
</script>
</body>
</html>
